name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, gd
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run feature smoke tests
        run: |
          php tests/taxonomy-feature-smoke.php
          php tests/mentor-feature-smoke.php
          php tests/admin-profile-actions-smoke.php
          php tests/analytics-feature-smoke.php
